[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfactor"
version = "0.1.0"
description = "A-share CSI100 price-volume factor library with LLM mining"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tushare>=1.4",
  "akshare>=1.14",
  "baostock>=0.8.8",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  # Starlette 1.0 removed the deprecated TemplateResponse(name, context) signature
  # used by the web UI in src/qfactor/api/app.py. Keep on the 0.x line until the
  # request-first signature is adopted.
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.27",
  "langgraph>=0.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
qfactor = "qfactor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]