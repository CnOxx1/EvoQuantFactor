hypothesis: 'The ratio of the 20-day moving average of turnover rate to the 20-day
  moving average of absolute return (ret_1d) predicts future 5-day returns: higher
  turnover relative to absolute return (i.e., high turnover with low price movement)
  is associated with higher future returns, indicating that active trading without
  price change may precede upward moves.；unlike This is not the same as the candidate
  ''div(abs(ret_1d),ma(turnover_rate,60))'' which uses absolute return in the numerator
  and a longer moving average of turnover; here we use the inverse ratio with a shorter
  window and no absolute value on return.'
