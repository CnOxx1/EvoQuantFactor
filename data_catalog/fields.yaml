universe: csi100
frequency: daily
family: price_volume

rules:
  signal_timing: "EOD fields available after close; trade_lag=1 by default"
  no_lookahead: true
  llm_allowed_fields_only: true

fields:
  - name: trade_date
    table: daily_bar
    dtype: date
    availability: eod
    trade_lag: 0
    desc: 交易日

  - name: ts_code
    table: daily_bar
    dtype: str
    availability: static
    trade_lag: 0
    desc: 股票代码

  - name: open
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 开盘价

  - name: high
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 最高价

  - name: low
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 最低价

  - name: close
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 收盘价（未复权）

  - name: pre_close
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 昨收

  - name: vol
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 成交量（手）

  - name: amount
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 成交额（千元）

  - name: adj_factor
    table: adj_factor
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 复权因子

  - name: close_adj
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 前复权收盘价

  - name: ret_1d
    table: daily_bar
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: 前复权日收益

  - name: turnover_rate
    table: daily_basic
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    optional: true
    desc: 换手率（%）

  - name: circ_mv
    table: daily_basic
    dtype: float
    availability: eod
    trade_lag: 1
    family: style
    optional: true
    desc: 流通市值（预留中性化）

  - name: industry
    table: industry
    dtype: str
    availability: daily
    trade_lag: 0
    family: style
    optional: true
    desc: 行业（必须使用点时分类；用于中性化）

  # 以下字段用于可交易性、容量、复权与风险控制，不进入 DSL/LLM 因子搜索空间。
  - name: is_st
    table: security_status
    dtype: bool
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: execution_constraint
    desc: 点时 ST 标记

  - name: is_suspended
    table: security_status
    dtype: bool
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: execution_constraint
    desc: 点时停牌标记

  - name: limit_up
    table: security_status
    dtype: float
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: execution_constraint
    desc: 当日涨停价（点时供应商记录）

  - name: limit_down
    table: security_status
    dtype: float
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: execution_constraint
    desc: 当日跌停价（点时供应商记录）

  - name: free_float_shares
    table: daily_basic
    dtype: float
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: capacity
    desc: 流通股本（容量及流通市值核验）

  - name: adv_20d
    table: daily_basic
    dtype: float
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: capacity
    desc: 过去 20 个已完成交易日平均成交额

  - name: corporate_action
    table: corporate_actions
    dtype: str
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: adjustment_audit
    desc: 供应商公司行动编码；显式 none 表示无事件

  - name: adj_factor_vendor
    table: corporate_actions
    dtype: float
    availability: eod
    trade_lag: 1
    optional: true
    llm_eligible: false
    role: adjustment_audit
    desc: 供应商复权因子，用于核验行情复权链

  - name: amplitude
    table: derived
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: (high-low)/close

  - name: overnight
    table: derived
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: open/pre_close - 1

  - name: upper_shadow
    table: derived
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: upper shadow ratio

  - name: lower_shadow
    table: derived
    dtype: float
    availability: eod
    trade_lag: 1
    family: price_volume
    desc: lower shadow ratio

# Reserved families (not used by LLM in phase-1)
reserved_fields:
  - name: pe_ttm
    family: fundamental
    status: reserved
  - name: net_profit_ttm
    family: fundamental
    status: reserved
  - name: news_sentiment
    family: text
    status: reserved