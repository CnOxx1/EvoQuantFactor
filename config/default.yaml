# 参考文档：描述推荐默认值。
# 注意：factor_backend 运行时不加载本文件。
# 生效配置来源：
#   1) 环境变量 / .env → factor_backend.config.Settings
#   2) SQLite llm_config / prompt_overrides（前端「LLM 配置」「提示词」页）

app:
  name: factor-agent
  host: 0.0.0.0
  port: 8080

pipeline:
  max_round: 3
  review_concurrency: 3
  save:
    mean_min: 80
    median_min: 75
    require_no_veto: true
  revise:
    only_low_score_factors: true
    rescore_only_changed_ids: true
    anti_noop_drop: true

models:
  # 实际以环境变量 LLM_MODEL_STEP1 / LLM_MODEL_REVIEW 或 DB 为准
  step1: gpt-4o
  review: gpt-4o-mini

llm:
  api_key_env: LLM_API_KEY
  base_url_env: LLM_BASE_URL

mcp:
  enabled: false
  note: stub only; do not treat evidence as real market data

prompts:
  dir: prompts
  index: prompts/index.json

storage:
  saved_factors_dir: data/saved
  runs_dir: data/runs

collector:
  enabled_by_default: false
  default_sources:
    - eastmoney_report
    - eastmoney_news
  optional_sources:
    - wallstreetcn
    - sina
    - ths
    - jin10
    - luobo
