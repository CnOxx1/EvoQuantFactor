# Hard gates. research = mining -> screened; production = candidate pool (strict).
# trade_lag is read from project.yaml defaults (1 = T-day signal, T+1 trade).
#
# min_icir is ANNUALIZED (daily ICIR * sqrt(252)) when icir_annualized: true.
# Production holdout uses Newey-West ICIR (lag = horizon-1). min_holdout_icir is NW units.
# Former overlapping-window 0.10 ≈ NW 0.06–0.07; 0.07 does not loosen the bar.

default:
  min_rank_ic_mean: 0.02
  min_abs_rank_ic_mean: 0.02
  min_icir: 1.0
  min_coverage: 0.70
  max_corr_existing: 0.70
  min_years_consistent: 2
  max_daily_turnover: 1.50
  require_no_lookahead: true
  min_layered_monotonic_score: 0.5
  require_recent_ic_positive: false
  require_oos: false
  require_cost_ls_positive: false
  require_years_same_sign: false

research:
  min_rank_ic_mean: 0.01
  min_abs_rank_ic_mean: 0.01
  min_icir: 1.0
  min_coverage: 0.60
  max_corr_existing: 0.85
  min_years_consistent: 2
  max_daily_turnover: 2.00
  require_no_lookahead: true
  min_layered_monotonic_score: 0.5
  # screened 因子可作为生成父本，因此软通过也不能跳过换手约束。
  soft_require_turnover: true
  require_recent_ic_positive: false
  require_oos: true
  min_oos_ic_mean: 0.0
  min_oos_pos_folds: 1
  require_cost_ls_positive: false
  require_years_same_sign: false

production:
  min_rank_ic_mean: 0.02
  min_abs_rank_ic_mean: 0.02
  min_icir: 1.5
  icir_annualized: false
  icir_mode: newey_west
  min_holdout_icir: 0.07   # NW ICIR; equivalent of former 0.10 overlapping window
  min_coverage: 0.70
  max_corr_existing: 0.70
  min_years_consistent: 3
  max_daily_turnover: 1.20
  require_no_lookahead: true
  min_layered_monotonic_score: 0.75
  require_recent_ic_positive: true
  require_oos: true
  oos_mode: freeze_sign    # train/holdout same sign; each holdout fold >= min_oos_ic_mean
  min_oos_ic_mean: 0.01
  min_oos_pos_folds: 2
  require_cost_ls_positive: true
  require_years_same_sign: true
  require_residual_ic: true
  min_resid_ic_mean: 0.01
  min_resid_icir: 0.07     # NW residual ICIR, same units as min_holdout_icir
  require_train_ic: true   # train IC must also clear min_rank_ic_mean; holdout-only is not enough
  # Multi-factor upstream quality contract: do not label a factor candidate when
  # its universe or size neutralization cannot support the claimed CSI100 basis.
  require_pit_universe: true
  allowed_universe_modes: [pit]
  require_vendor_circ_mv: true
  allowed_circ_mv_sources: [tushare_daily_basic, archive_daily_basic, rqdata_daily_basic]
  min_daily_basic_coverage: 0.80
  # Execution and risk evidence must be point-in-time and near-complete. Unknown
  # is not treated as tradable; the release service applies these fail-closed.
  require_execution_data: true
  min_security_status_coverage: 0.98
  min_limit_price_coverage: 0.98
  min_adv_20d_coverage: 0.95
  min_corporate_action_coverage: 0.98
  min_industry_pit_coverage: 0.95
  min_risk_exposures_coverage: 0.95
  # H-day IC observations overlap. Require a material count of independent
  # observations before a single factor becomes strategy input.
  min_independent_observations: 60

eval:
  forward_horizon: 5
  trade_lag: 1          # override project.defaults.trade_lag if set
  train_end: "20251231" # legacy research boundary; sealed acceptance uses partitions below
  # Leave all fields blank until PIT long history has passed the data contract.
  # Once filled, the three windows are immutable for an experiment/release.
  partitions:
    discovery_start: ""
    discovery_end: ""
    selection_start: ""
    selection_end: ""
    sealed_start: ""
    sealed_end: ""
  n_quantiles: 5
  cost_bps: 10
  min_obs_per_day: 30
  recent_days: 120
  oos_folds: 4
  oos_min_days: 40
  neutralize_industry: true
  neutralize_size: true   # circ_mv only; never OLS on amount if circ_mv missing
  signal_hold_days: 5     # research and production share this H-day hold
