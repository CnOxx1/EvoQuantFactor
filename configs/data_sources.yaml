primary: tushare
fallback: baostock

# Universe reconstitutions always prefer Tushare (even when bars come from Baostock).
# Set project.yaml universe_policy.mode=snapshot to keep the old latest-file stamp.
tushare:
  index_code: "000903.SH"
  sleep_seconds: 0.35

baostock:
  index_code: "sh.000903"

csindex:
  index_code: "000903"

akshare:
  index_symbol: "sh000903"

cache:
  enable: true
  format: parquet