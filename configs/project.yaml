project_name: qfactor
universe: csi100
universe_policy:
  mode: pit              # pit | freeze_start | snapshot
  lookback_days: 120     # pull the reconstitution before window start
frequency: daily
timezone: Asia/Shanghai

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_catalog: data_catalog
  factor_lib: factor_lib
  runs: runs
  database: data/qfactor.sqlite3

defaults:
  adj_type: qfq          # forward-adjusted close
  trade_lag: 1           # signal on T, trade on T+1
  family: price_volume

# Factor production loop (keep lean; do not stack more frameworks)
production:
  llm:
    llm_ratio: 0.45          # keep templates/mechanism coverage meaningful
    # llm_mutate_share is unused: llm_slot_plan owns mutate vs fresh vs crossover
    llm_batch_size: 4
    llm_retries: 3
    perturb_ratio: 0.15
    llm_review_ratio: 0      # no LLM veto; parser + apply_gate decide
    llm_decide_theme: false   # local rotator already covers themes; saves one LLM call/round
    llm_library_mutate_slots: 1  # thick catalog: 1 mutate (+ 1 fresh on n>=6); rest compose
    catalog_expand_every: 20     # while mining, refill new skeletons every N rounds
    catalog_expand_max: 10       # max templates merged per refill; new-skeleton gate
    catalog_expand_unused_lt: 0  # 0 = do not wait for empty catalog; keep producing
  diversity:
    fsa_ratio: 0.12
    max_corr_ban: 0.90
    max_per_skeleton: 2
    soft_switch_after: 2
    hard_rotate: true
    prefer_undercovered: true
  cold_start:
    min_parents: 8              # screened+candidate+approved below this = cold
    disable_fsa: true           # hashes only; no skeleton freeze while cold
    llm_fresh_ratio: 0.30       # hypothesis-first even while catalog is thick
    curriculum: true            # unary depth 1–2 before pairwise compose
    prior_update_every: 20      # rebuild field/window weights every N rounds (0 = every batch)
    cheap_ic_min: 0.008         # skip full gate when |train IC| below this
    parent_top_screened: 12     # screened parent budget, split across unblocked mechanisms

# Fetch / keep / check bars before any mining. Supervisor and `produce` call
# this first. PIT is tried first; snapshot is a research-only fallback.
data_prepare:
  start: "20160102"
  end: ""                    # empty = today in project timezone
  source: baostock
  allow_snapshot_universe: true
  refresh_if_incomplete: true
  require_research_contract: true
  require_window_coverage: true
  min_covering_names: 50     # names that already span start–end

# Every discovery run receives an append-only experiment manifest and complete
# trial ledger. Search outputs remain research-only until separately frozen,
# sealed, tradability-tested, and released.
experiment:
  max_trials: 800
  require_manifest: true
  clean_discovery_default: true
  bootstrap_research_only: true
  sealed_oos_state: unconfigured
  release_requires_tradability: true
  release_requires_sealed_oos: true
  release_requires_data_contract: true

library_ops:
  archive_draft_days: 14
  archive_reject_days: 7
  auto_demote_corr: 0.70          # same bar as production max_corr_existing
  cap_usable_per_mechanism: 1     # USABLE keeps one factor per mechanism

# Reserved for later expansion (do not remove)
expansion:
  universes_future: [csi300, csi500, csi1000]
  families_future: [fundamental, analyst, text, alternative]
  frequencies_future: [minute, weekly]
  web_ui: true