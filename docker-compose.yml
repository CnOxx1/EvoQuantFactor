services:
  factor-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: factor-api:latest
    container_name: factor-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      PROMPTS_DIR: /app/prompts
      # 一体模式默认内嵌 worker；split profile 下应设 WORKER_ENABLED=false
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      REPORT_COLLECTOR_ENABLED: ${REPORT_COLLECTOR_ENABLED:-false}
      NEWS_SUMMARIZE_ENABLED: ${NEWS_SUMMARIZE_ENABLED:-false}
    volumes:
      - ./prompts:/app/prompts:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./backend:/app/backend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - factor-net

  # 可选：与 API 拆分的 job worker（docker compose --profile split up）
  factor-worker:
    profiles: ["split"]
    image: factor-api:latest
    container_name: factor-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMPTS_DIR: /app/prompts
      WORKER_ENABLED: "true"
      REPORT_COLLECTOR_ENABLED: "false"
      NEWS_SUMMARIZE_ENABLED: "false"
    command: ["python", "-m", "factor_backend", "worker"]
    volumes:
      - ./prompts:/app/prompts:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./backend:/app/backend:ro
    networks:
      - factor-net
    depends_on:
      - factor-api

  factor-collector:
    profiles: ["split"]
    image: factor-api:latest
    container_name: factor-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMPTS_DIR: /app/prompts
      REPORT_COLLECTOR_ENABLED: "true"
      NEWS_SUMMARIZE_ENABLED: ${NEWS_SUMMARIZE_ENABLED:-false}
    command: ["python", "-m", "factor_backend", "collector"]
    volumes:
      - ./prompts:/app/prompts:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./backend:/app/backend:ro
    networks:
      - factor-net
    depends_on:
      - factor-api

networks:
  factor-net:
    driver: bridge
